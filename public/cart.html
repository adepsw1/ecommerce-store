<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Your Brand</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo"><i class="fas fa-store logo-icon"></i> Your<span>Brand</span></a>
      <div class="nav-search">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="handleSearch(event)">
      </div>
      <div class="nav-actions">
        <a href="/cart.html" class="nav-btn" title="Cart" style="color:var(--accent)">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge" id="cartBadge" style="display:none">0</span>
        </a>
        <div id="authButtons"><a href="/login.html" class="btn btn-outline btn-sm">Sign In</a></div>
        <div id="userMenu" style="display:none">
          <div class="nav-btn" onclick="toggleUserDropdown()" style="cursor:pointer"><i class="fas fa-user-circle"></i></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="cart-page">
    <div class="container">
      <div class="breadcrumb">
        <a href="/">Home</a> <span class="sep">/</span> <span>Shopping Cart</span>
      </div>

      <h1 class="page-title"><i class="fas fa-shopping-bag"></i> Shopping Cart</h1>

      <div id="cartContent">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <footer class="footer" style="margin-top:80px">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 Your Brand. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadCart);

    async function loadCart() {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-shopping-bag"></i>
            <h3>Your cart is empty</h3>
            <p>Please sign in to view your cart</p>
            <a href="/login.html" class="btn btn-primary">Sign In</a>
          </div>`;
        return;
      }

      const data = await api('/api/cart');
      if (!data.items || data.items.length === 0) {
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-shopping-bag"></i>
            <h3>Your cart is empty</h3>
            <p>Looks like you haven't added anything to your cart yet</p>
            <a href="/shop.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
          </div>`;
        return;
      }

      const subtotal = data.subtotal;
      const tax = Math.round(subtotal * 0.05 * 100) / 100;
      const shipping = subtotal >= 999 ? 0 : 99;
      const total = (subtotal + tax + shipping).toFixed(2);

      document.getElementById('cartContent').innerHTML = `
        <div class="cart-grid">
          <div class="cart-items">
            ${data.items.map(item => `
              <div class="cart-item" id="cartItem${item.id}">
                <img src="${escapeHtml(item.image || 'https://via.placeholder.com/100')}" alt="${escapeHtml(item.name)}">
                <div class="cart-item-info" style="flex:1">
                  <h3><a href="/product.html?slug=${escapeHtml(item.slug)}">${escapeHtml(item.name)}</a></h3>
                  ${item.compare_price ? `<span style="font-size:13px;color:var(--text-muted);text-decoration:line-through">\u20B9${item.compare_price.toFixed(2)}</span>` : ''}
                  <div class="price">\u20B9${item.price.toFixed(2)}</div>
                  <div style="display:flex;align-items:center;gap:16px;margin-top:12px">
                    <div class="quantity-selector" style="margin-bottom:0">
                      <button onclick="updateQty(${item.id}, ${item.quantity - 1})">−</button>
                      <input type="number" value="${item.quantity}" min="1" max="${item.stock}" 
                        onchange="updateQty(${item.id}, parseInt(this.value))" style="width:50px">
                      <button onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                    <span style="font-weight:700;font-size:16px">\u20B9${(item.price * item.quantity).toFixed(2)}</span>
                    <button onclick="removeItem(${item.id})" class="btn btn-icon btn-outline" style="margin-left:auto;color:var(--danger);border-color:var(--danger)" title="Remove">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </div>
                </div>
              </div>
            `).join('')}
            <div style="display:flex;gap:12px;margin-top:8px">
              <a href="/shop.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
              <button class="btn btn-outline" style="color:var(--danger);border-color:var(--danger)" onclick="clearCart()"><i class="fas fa-trash"></i> Clear Cart</button>
            </div>
          </div>

          <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="coupon-form">
              <input type="text" id="couponInput" placeholder="Enter coupon code">
              <button class="btn btn-outline btn-sm" onclick="applyCoupon()">Apply</button>
            </div>
            <div id="couponDiscount"></div>
            <div class="summary-row">
              <span>Subtotal</span>
              <span>\u20B9${subtotal.toFixed(2)}</span>
            </div>
            <div class="summary-row">
              <span>GST (5%)</span>
              <span>\u20B9${tax.toFixed(2)}</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>${shipping === 0 ? '<span style="color:var(--success);font-weight:600">FREE</span>' : '\u20B9' + shipping.toFixed(2)}</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="cartTotal">\u20B9${total}</span>
            </div>
            <a href="/checkout.html" class="btn btn-primary btn-block btn-lg mt-24">
              <i class="fas fa-lock"></i> Proceed to Checkout
            </a>
            <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
              <i class="fas fa-shield-alt"></i> Secure SSL Encrypted Checkout
            </div>
          </div>
        </div>
      `;
    }

    async function updateQty(itemId, qty) {
      if (qty < 1) return removeItem(itemId);
      await api(`/api/cart/${itemId}`, 'PUT', { quantity: qty });
      loadCart();
      updateCartBadge();
    }

    async function removeItem(itemId) {
      await api(`/api/cart/${itemId}`, 'DELETE');
      showToast('Item removed from cart');
      loadCart();
      updateCartBadge();
    }

    async function clearCart() {
      if (!confirm('Remove all items from your cart?')) return;
      await api('/api/cart', 'DELETE');
      showToast('Cart cleared');
      loadCart();
      updateCartBadge();
    }

    async function applyCoupon() {
      const code = document.getElementById('couponInput').value.trim();
      if (!code) return;
      const res = await api('/api/cart/coupon', 'POST', { code });
      if (res.error) {
        showToast(res.error, 'error');
      } else {
        document.getElementById('couponDiscount').innerHTML = `
          <div class="summary-row" style="color:var(--success)">
            <span><i class="fas fa-tag"></i> Coupon: ${escapeHtml(res.coupon.code)}</span>
            <span>-\u20B9${res.discount.toFixed(2)}</span>
          </div>`;
        showToast(`Coupon applied! You save \u20B9${res.discount.toFixed(2)}`, 'success');
        localStorage.setItem('coupon_code', code);
        localStorage.setItem('coupon_discount', res.discount);
      }
    }
  </script>
</body>
</html>
