<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Your Brand</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo"><i class="fas fa-store logo-icon"></i> Your<span>Brand</span></a>
      <div class="nav-search">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search for products..." onkeyup="handleSearch(event)">
      </div>
      <div class="nav-actions">
        <a href="/cart.html" class="nav-btn" title="Cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge" id="cartBadge" style="display:none">0</span>
        </a>
        <div id="authButtons"><a href="/login.html" class="btn btn-outline btn-sm">Sign In</a></div>
        <div id="userMenu" style="display:none">
          <div class="nav-btn" onclick="toggleUserDropdown()" style="cursor:pointer"><i class="fas fa-user-circle"></i></div>
        </div>
      </div>
    </div>
  </nav>

  <main style="padding:40px 0 80px">
    <div class="container" style="max-width:700px">
      <div class="breadcrumb">
        <a href="/">Home</a> <span class="sep">/</span> <span>My Profile</span>
      </div>

      <h1 class="page-title"><i class="fas fa-user"></i> My Profile</h1>

      <div class="admin-card">
        <div class="admin-card-header"><h2>Personal Information</h2></div>
        <div style="padding:24px">
          <form id="profileForm" onsubmit="updateProfile(event)">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="profName" required placeholder="Your name">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="profEmail" disabled style="background:var(--bg);color:var(--text-muted)">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="profPhone" placeholder="+91 93739 25938">
            </div>
            <div class="form-group">
              <label>Street Address</label>
              <input type="text" id="profAddress" placeholder="42, MG Road, Near City Mall">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City</label>
                <input type="text" id="profCity" placeholder="Chennai">
              </div>
              <div class="form-group">
                <label>State</label>
                <input type="text" id="profState" placeholder="Tamil Nadu">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>PIN Code</label>
                <input type="text" id="profZip" placeholder="600001" maxlength="6" oninput="lookupPincode(this.value, 'profCity', 'profState')">
              </div>
              <div class="form-group">
                <label>Country</label>
                <select id="profCountry">
                  <option value="IN">India</option>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="UK">United Kingdom</option>
                  <option value="AU">Australia</option>
                </select>
              </div>
            </div>
            <div style="display:flex;gap:12px;margin-top:8px">
              <button type="submit" class="btn btn-primary" id="saveBtn">
                <i class="fas fa-save"></i> Save Changes
              </button>
              <a href="/orders.html" class="btn btn-outline"><i class="fas fa-box"></i> My Orders</a>
            </div>
          </form>
        </div>
      </div>

      <div class="admin-card" style="margin-top:24px">
        <div class="admin-card-header"><h2>Account Details</h2></div>
        <div style="padding:24px">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-light)">
            <div><strong>Role</strong><br><span style="font-size:13px;color:var(--text-muted)" id="profRole"></span></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0">
            <div><strong>Member Since</strong><br><span style="font-size:13px;color:var(--text-muted)" id="profJoined"></span></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" style="margin-top:0">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 Your Brand. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadProfile);

    async function loadProfile() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = '/login.html'; return; }

      const profile = await api('/api/auth/profile');
      if (profile.error) { showToast(profile.error, 'error'); return; }

      document.getElementById('profName').value = profile.name || '';
      document.getElementById('profEmail').value = profile.email || '';
      document.getElementById('profPhone').value = profile.phone || '';
      document.getElementById('profAddress').value = profile.address || '';
      document.getElementById('profCity').value = profile.city || '';
      document.getElementById('profState').value = profile.state || '';
      document.getElementById('profZip').value = profile.zip || '';
      document.getElementById('profCountry').value = profile.country || 'IN';
      document.getElementById('profRole').textContent = profile.role === 'admin' ? 'Administrator' : 'Customer';
      document.getElementById('profJoined').textContent = new Date(profile.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    async function updateProfile(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      const res = await api('/api/auth/profile', 'PUT', {
        name: document.getElementById('profName').value,
        phone: document.getElementById('profPhone').value,
        address: document.getElementById('profAddress').value,
        city: document.getElementById('profCity').value,
        state: document.getElementById('profState').value,
        zip: document.getElementById('profZip').value,
        country: document.getElementById('profCountry').value
      });

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';

      if (res.error) {
        showToast(res.error, 'error');
      } else {
        showToast('Profile updated successfully!', 'success');
        // Update stored user name
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        user.name = document.getElementById('profName').value;
        localStorage.setItem('user', JSON.stringify(user));
      }
    }
  </script>
</body>
</html>
