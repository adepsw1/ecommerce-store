<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Your Brand</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:28px">
        <a href="/" class="logo" style="justify-content:center;font-size:32px"><i class="fas fa-store logo-icon"></i> Your<span>Brand</span></a>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to your account to continue shopping</p>

      <form id="loginForm" style="margin-top:24px">
        <div class="form-group" style="margin-bottom:16px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-muted)">Email Address</label>
          <div style="position:relative">
            <input type="email" id="loginEmail" required placeholder="Enter your email"
              style="width:100%;padding:12px 12px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border-color 0.3s">
            <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px"></i>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-muted)">Password</label>
          <div style="position:relative">
            <input type="password" id="loginPassword" required placeholder="Enter your password" minlength="6"
              style="width:100%;padding:12px 12px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border-color 0.3s">
            <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px"></i>
          </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="padding:13px;font-size:15px;font-weight:600;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div id="googleSection">
        <div style="display:flex;align-items:center;gap:12px;margin:24px 0">
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px">or</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>
        <div id="googleBtnContainer" style="display:flex;justify-content:center">
          <div id="g_id_signin"></div>
        </div>
      </div>

      <div id="loginStatus" style="text-align:center;display:none">
        <div class="spinner" style="margin:0 auto"></div>
        <p style="margin-top:12px;color:var(--text-muted)">Signing you in...</p>
      </div>

      <div style="text-align:center;margin-top:24px">
        <a href="/register.html" style="font-size:14px;color:var(--accent);font-weight:600;transition:color 0.3s">Don't have an account? <span style="text-decoration:underline">Sign up</span></a>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-size:12px;color:var(--text-muted)">
        <i class="fas fa-headset" style="color:var(--gold)"></i> Need help? Call +91 93739 25938
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (localStorage.getItem('token')) window.location.href = '/';

    // Email/Password Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please enter email and password', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          showToast(data.error || 'Login failed', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showToast('Welcome, ' + data.user.name + '!', 'success');
        setTimeout(() => { window.location.href = '/'; }, 600);
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });

    // Initialize Google Sign-In (optional - works when configured)
    (async function initGoogleSignIn() {
      const config = await api('/api/auth/config');
      if (!config.googleClientId || config.googleClientId.includes('REPLACE')) {
        document.getElementById('googleSection').style.display = 'none';
        return;
      }

      // Use redirect mode (works on mobile and desktop)
      const origin = window.location.origin;
      google.accounts.id.initialize({
        client_id: config.googleClientId,
        ux_mode: 'redirect',
        login_uri: origin + '/api/auth/google/redirect',
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById('g_id_signin'),
        { theme: 'outline', size: 'large', width: 320, text: 'signin_with', shape: 'rectangular', logo_alignment: 'left' }
      );
    })();

    // Handle error from redirect flow
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
      showToast('Google sign-in failed. Please try again.', 'error');
    }
  </script>
</body>
</html>
