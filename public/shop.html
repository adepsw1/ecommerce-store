<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Art Supplies - Your Brand</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo"><i class="fas fa-store logo-icon"></i> Your<span>Brand</span></a>
      <div class="nav-search">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search art supplies, paints, brushes..." onkeyup="handleSearch(event)">
      </div>
      <div class="nav-actions">
        <a href="/cart.html" class="nav-btn" title="Cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge" id="cartBadge" style="display:none">0</span>
        </a>
        <div id="authButtons"><a href="/login.html" class="btn btn-outline btn-sm">Sign In</a></div>
        <div id="userMenu" style="display:none">
          <div class="nav-btn" onclick="toggleUserDropdown()" style="cursor:pointer"><i class="fas fa-user-circle"></i></div>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="breadcrumb">
        <a href="/">Home</a> <span class="sep">/</span> <span id="breadcrumbCurrent">Shop</span>
      </div>

      <h1 class="page-title" id="pageTitle">All Products</h1>

      <div class="filter-bar">
        <div class="filter-tabs" id="categoryTabs">
          <button class="filter-tab active" data-category="">All</button>
        </div>
        <div class="filter-sort">
          <select id="sortSelect" onchange="loadProducts()">
            <option value="">Sort by: Default</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
            <option value="name">Name A-Z</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="productsGrid">
        <div class="loading"><div class="spinner"></div></div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer class="footer" style="margin-top: 80px">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 Your Brand. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    let currentCategory = '';
    let currentPage = 1;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      currentCategory = params.get('category') || '';
      const search = params.get('search') || '';
      const featured = params.get('featured') || '';

      if (search) document.getElementById('searchInput').value = search;
      if (featured) document.getElementById('pageTitle').textContent = 'Bestselling Art Supplies';

      loadCategoryTabs();
      loadProducts();
    });

    async function loadCategoryTabs() {
      const categories = await api('/api/products/meta/categories');
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = `<button class="filter-tab ${!currentCategory ? 'active' : ''}" data-category="" onclick="selectCategory('')">All</button>` +
        categories.map(c => `<button class="filter-tab ${currentCategory === c.slug ? 'active' : ''}" data-category="${escapeHtml(c.slug)}" onclick="selectCategory('${escapeHtml(c.slug)}')">${escapeHtml(c.name)}</button>`).join('');
    }

    function selectCategory(slug) {
      currentCategory = slug;
      currentPage = 1;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-category="${slug}"]`).classList.add('active');
      loadProducts();
    }

    async function loadProducts() {
      const params = new URLSearchParams(window.location.search);
      const search = params.get('search') || document.getElementById('searchInput').value || '';
      const featured = params.get('featured') || '';
      const sort = document.getElementById('sortSelect').value;

      let url = `/api/products?page=${currentPage}&limit=12`;
      if (currentCategory) url += `&category=${currentCategory}`;
      if (search) url += `&search=${encodeURIComponent(search)}`;
      if (featured) url += `&featured=true`;
      if (sort) url += `&sort=${sort}`;

      const data = await api(url);
      const grid = document.getElementById('productsGrid');

      if (data.products.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-search"></i><h3>No products found</h3><p>Try adjusting your search or filters</p></div>`;
      } else {
        grid.innerHTML = data.products.map(p => productCard(p)).join('');
      }

      renderPagination(data.page, data.totalPages);
    }

    function renderPagination(page, totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = '';
      if (page > 1) html += `<button onclick="goToPage(${page-1})"><i class="fas fa-chevron-left"></i></button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      if (page < totalPages) html += `<button onclick="goToPage(${page+1})"><i class="fas fa-chevron-right"></i></button>`;
      el.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      loadProducts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
