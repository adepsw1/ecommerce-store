<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Your Brand</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:28px">
        <a href="/" class="logo" style="justify-content:center;font-size:32px"><i class="fas fa-store logo-icon"></i> Your<span>Brand</span></a>
      </div>
      <h1>Create Account</h1>
      <p>Join thousands of artists exploring premium art supplies</p>

      <form id="registerForm" style="margin-top:24px">
        <div class="form-group" style="margin-bottom:16px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-muted)">Full Name</label>
          <div style="position:relative">
            <input type="text" id="regName" required placeholder="Enter your name"
              style="width:100%;padding:12px 12px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border-color 0.3s">
            <i class="fas fa-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px"></i>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:16px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-muted)">Email Address</label>
          <div style="position:relative">
            <input type="email" id="regEmail" required placeholder="Enter your email"
              style="width:100%;padding:12px 12px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border-color 0.3s">
            <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px"></i>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-muted)">Password</label>
          <div style="position:relative">
            <input type="password" id="regPassword" required placeholder="Create a password (min 6 chars)" minlength="6"
              style="width:100%;padding:12px 12px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border-color 0.3s">
            <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px"></i>
          </div>
        </div>
        <button type="submit" id="regBtn" class="btn btn-primary btn-block" style="padding:13px;font-size:15px;font-weight:600;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div id="googleSection">
        <div style="display:flex;align-items:center;gap:12px;margin:24px 0">
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px">or</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>
        <div id="googleBtnContainer" style="display:flex;justify-content:center">
          <div id="g_id_signin"></div>
        </div>
      </div>

      <div id="loginStatus" style="text-align:center;display:none">
        <div class="spinner" style="margin:0 auto"></div>
        <p style="margin-top:12px;color:var(--text-muted)">Creating your account...</p>
      </div>

      <div class="auth-footer" style="margin-top:28px">
        Already have an account? <a href="/login.html" style="color:var(--accent);font-weight:600">Sign In</a>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:12px;color:var(--text-muted)">
        <i class="fas fa-headset" style="color:var(--gold)"></i> Need help? Call +91 93739 25938
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (localStorage.getItem('token')) window.location.href = '/';

    // Email/Password Registration
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!name || !email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          showToast(data.error || 'Registration failed', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showToast('Welcome to Your Brand, ' + data.user.name + '!', 'success');
        setTimeout(() => { window.location.href = '/'; }, 600);
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    });

    // Initialize Google Sign-In (optional - works when configured)
    (async function initGoogleSignIn() {
      const config = await api('/api/auth/config');
      if (!config.googleClientId || config.googleClientId.includes('REPLACE')) {
        document.getElementById('googleSection').style.display = 'none';
        return;
      }

      google.accounts.id.initialize({
        client_id: config.googleClientId,
        callback: handleGoogleResponse,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById('g_id_signin'),
        { theme: 'outline', size: 'large', width: 320, text: 'signup_with', shape: 'rectangular', logo_alignment: 'left' }
      );
    })();

    async function handleGoogleResponse(response) {
      document.getElementById('googleBtnContainer').style.display = 'none';
      document.getElementById('loginStatus').style.display = 'block';

      const res = await api('/api/auth/google', 'POST', { credential: response.credential });

      if (res.error) {
        showToast(res.error, 'error');
        document.getElementById('googleBtnContainer').style.display = 'flex';
        document.getElementById('loginStatus').style.display = 'none';
        return;
      }

      localStorage.setItem('token', res.token);
      localStorage.setItem('user', JSON.stringify(res.user));
      showToast('Welcome to Your Brand, ' + res.user.name + '!', 'success');
      setTimeout(() => { window.location.href = '/'; }, 500);
    }
  </script>
</body>
</html>
